<!DOCTYPE html> <!--Indica al navegador que el documento es HTML5. Es la declaración estándar que permite al navegador renderizar la página correctamente-->
<html lang="es"> <!-- Indica que el contenido está en español -->
<head>
    <meta charset="UTF-8"> <!--Define la codificación de caracteres (UTF-8), necesaria para mostrar correctamente acentos y caracteres especiales-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--viewport sirve para que pueda verse en el celu-->
    <title>Proyecto Latinas in Cloud Tracker de Hábitos</title> <!-- este título no es visible en la página en sí-->

    <!-- CDN para íconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos embebidos de CSS-->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* Formulario */
        .add-form {  /* centra y da estilo al formulario de agregar*/
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .add-form input {
            padding: 10px;
            width: 260px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .add-form button {
            padding: 10px 15px;
            margin-left: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-form button:hover {
            background: #0056b3;
        }

        /* creación de listas de hábitos centradas */
        .habit-list {
            max-width: 500px;
            margin: auto;
        }

        .habit-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid transparent;
        }

        .completed {
            border-left-color: #28a745;
            opacity: 0.7;
            text-decoration: line-through;
        }

        .buttons form {
            display: inline;
        }

        .btn { /*agrupa estilos para botones*/
            padding: 6px 8px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            margin-left: 5px;
            color: white;
        }

        .btn-complete { background: #28a745; }
        .btn-edit { background: #ffc107; color: black; }
        .btn-delete { background: #dc3545; }

        .btn-complete:hover { background: #1e7e34; }
        .btn-delete:hover { background: #b52a37; }
    </style>
</head>

<body>
    <h1>Mis Hábitos</h1>

    <!-- Formulario para agregar hábito -->
    <form class="add-form" action="{{ url_for('main.add_habit') }}" method="POST">
        <input type="text" name="name" placeholder="Nuevo hábito..." required> <!-- required evita que el navegador envíe el formulario vacío (validación mínima cliente)-->
        <button type="submit">Agregar</button>
    </form>

    <div class="habit-list"> <!-- contiene todas las tarjetas-->
        {% for habit in habits %} <!-- bucle Jinja2 que itera la lista habits pasada desde Flask (index())-->
        <div class="habit-item {% if habit.completed %}completed{% endif %}"> <!-- añade clase completed si habit.completed es true -->
            <span>{{ habit.name }}</span>

            <div class="buttons">

                <!-- Botón completar -->
                <form action="{{ url_for('main.complete_habit', habit_id=habit.id) }}" method="POST">
                    <button class="btn btn-complete" type="submit">
                        <i class="fa-solid fa-check"></i> <!-- ícono de completar -->
                    </button>
                </form>

                <!-- Botón editar -->
                <a href="{{ url_for('main.edit_habit', habit_id=habit.id) }}">
                    <button class="btn btn-edit" type="button">
                        <i class="fa-solid fa-pen"></i> <!-- ícono editar -->
                    </button>
                </a>

                <!-- Botón eliminar -->
                <form action="{{ url_for('main.delete_habit', habit_id=habit.id) }}" method="POST">
                    <button class="btn btn-delete" type="submit">
                        <i class="fa-solid fa-trash"></i> <!-- ícono eliminar -->
                    </button>
                </form>

            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
