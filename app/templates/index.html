<!DOCTYPE html> <!--Indica al navegador que el documento es HTML5. Es la declaración estándar que permite al navegador renderizar la página correctamente-->
<html lang="es"> <!-- Indica que el contenido está en español -->
<head>
    <meta charset="UTF-8"> <!--Define la codificación de caracteres (UTF-8), necesaria para mostrar correctamente acentos y caracteres especiales-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Latinas in Cloud Tracker de Hábitos</title> <!-- este título no es visible en la página en sí-->
    <!-- Estilos -->
     <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #333;
        }

        /* Formulario */
        .add-form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .add-form input {
            padding: 10px;
            width: 260px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .add-form button {
            padding: 10px 15px;
            margin-left: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-form button:hover {
            background: #0056b3;
        }

        /* Lista de hábitos */
        .habit-list {
            max-width: 500px;
            margin: auto;
        }

        .habit-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid transparent;
        }

        .completed {
            border-left-color: #28a745;
            opacity: 0.7;
            text-decoration: line-through;
        }

        .buttons form {
            display: inline;
        }

        .btn {
            padding: 6px 8px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            margin-left: 5px;
        }

        .btn-complete { background: #28a745; color: white; }
        .btn-edit { background: #ffc107; }
        .btn-delete { background: #dc3545; color: white; }

        .btn-complete:hover { background: #1e7e34; }
        .btn-delete:hover { background: #b52a37; }
     </style>
</head>

<body>
    <h1>Mis Hábitos</h1>

        <!-- Formulario para agregar hábito -->
    <form class="add-form" action="{{ url_for('main.add_habit') }}" method="POST">
        <input type="text" name="name" placeholder="Nuevo hábito..." required>
        <button type="submit">Agregar</button>
    </form>

        <div class="habit-list">
        {% for habit in habits %}
        <div class="habit-item {% if habit.completed %}completed{% endif %}">
            <span>{{ habit.name }}</span>

            <div class="buttons">
                <!-- Botón completar -->
                <form action="{{ url_for('main.complete_habit', habit_id=habit.id) }}" method="POST">
                    <button class="btn btn-complete" type="submit">
                        {% if habit.completed %}Desmarcar{% else %}Completar{% endif %}
                    </button>
                </form>

                <!-- Botón editar -->
                <a href="{{ url_for('main.edit_habit', habit_id=habit.id) }}">
                    <button class="btn btn-edit" type="button">Editar</button>
                </a>

                <!-- Botón eliminar -->
                <form action="{{ url_for('main.delete_habit', habit_id=habit.id) }}" method="POST">
                    <button class="btn btn-delete" type="submit">Eliminar</button>
                </form>

            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
