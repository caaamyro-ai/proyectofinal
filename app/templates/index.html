<!DOCTYPE html> <!--Indica al navegador que el documento es HTML5. Es la declaración estándar que permite al navegador renderizar la página correctamente-->
<html lang="es"> <!-- Indica que el contenido está en español -->
<head>
    <meta charset="UTF-8"> <!--Define la codificación de caracteres UTF-8 para mostrar tildes y caracteres especiales-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Adaptación para móviles-->  
    <title>Proyecto Latinas in Cloud Tracker de Hábitos</title>

    <!-- Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }

        /* Formulario */
        .add-form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .add-form input {
            padding: 10px;
            width: 260px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .add-form button {
            padding: 10px 15px;
            margin-left: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .add-form button:hover {
            background: #0056b3;
        }

        /* Lista de hábitos */
        .habit-list {
            max-width: 600px;
            margin: auto;
            margin-top: 30px;
        }
        .habit-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid transparent;
        }
        .completed {
            border-left-color: #28a745;
            opacity: 0.7;
            text-decoration: line-through;
        }

        /* Botones */
        .buttons form { display: inline; }
        .btn {
            padding: 6px 8px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            margin-left: 5px;
        }
        .btn-complete { background: #28a745; color: white; }
        .btn-edit { background: #ffc107; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-complete:hover { background: #1e7e34; }
        .btn-delete:hover { background: #b52a37; }

        /* Tooltip */
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: black;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        /* Contenedor de días semanales */
        .days-box {
            margin-top: 10px;
        }
        .day-label {
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <h1>Mis Hábitos</h1>
    <!--   FORMULARIO: HÁBITOS DIARIOS -->
    <h2>Hábitos Diarios</h2>

    <!-- Formulario para agregar hábito diario -->
    <!--ahora apunta a main.add_daily_habit (nuevo endpoint correcto) -->
    <form class="add-form" action="{{ url_for('main.add_daily_habit') }}" method="POST">
        <input type="text" name="name" placeholder="Nuevo hábito diario..." required>
        <button type="submit">Agregar</button>
    </form>

    <!-- LISTA DE HÁBITOS DIARIOS -->
    <div class="habit-list">
        {% for habit in daily %}
        <div class="habit-item {% if habit.completed %}completed{% endif %}">
            <span>{{ habit.name }}</span>

            <div class="buttons">

                <!-- Botón completar -->
                <form action="{{ url_for('main.toggle_daily', habit_id=habit.id) }}" method="POST" class="tooltip">
                    <button class="btn btn-complete" type="submit">
                        <i class="fa-solid fa-check"></i>
                    </button>
                    <span class="tooltiptext">Marcar/Desmarcar</span>
                </form>

                <!-- Botón editar -->
                <a href="{{ url_for('main.edit_daily', habit_id=habit.id) }}" class="tooltip">
                    <button class="btn btn-edit" type="button">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <span class="tooltiptext">Editar</span>
                </a>

                <!-- Botón eliminar -->
                <form action="{{ url_for('main.delete_daily', habit_id=habit.id) }}" method="POST" class="tooltip">
                    <button class="btn btn-delete" type="submit">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <span class="tooltiptext">Eliminar</span>
                </form>

            </div>
        </div>
        {% endfor %}
    </div>

    <!--   FORMULARIO: HÁBITOS SEMANALES -->
    <h2>Hábitos Semanales</h2>

    <!-- Formulario para agregar hábito semanal -->
    <!-- Formato específico: checkboxes para elegir días -->
    <form class="add-form" action="{{ url_for('main.add_weekly_habit') }}" method="POST" style="flex-direction: column; align-items:center;">

        <input type="text" name="name" placeholder="Nuevo hábito semanal..." required>

        <div class="days-box">
            <!-- NOTA: values iguales a los almacenados en DB -->
            <label class="day-label"><input type="checkbox" name="days" value="mon"> Lun</label>
            <label class="day-label"><input type="checkbox" name="days" value="tue"> Mar</label>
            <label class="day-label"><input type="checkbox" name="days" value="wed"> Mié</label>
            <label class="day-label"><input type="checkbox" name="days" value="thu"> Jue</label>
            <label class="day-label"><input type="checkbox" name="days" value="fri"> Vie</label>
            <label class="day-label"><input type="checkbox" name="days" value="sat"> Sáb</label>
            <label class="day-label"><input type="checkbox" name="days" value="sun"> Dom</label>
        </div>

        <button type="submit" style="margin-top:10px;">Agregar</button>
    </form>

    <!-- LISTA DE HÁBITOS SEMANALES -->
    <div class="habit-list">
        {% for habit in weekly %}
        <div class="habit-item">
            <span>{{ habit.name }}</span>

            <div>
                <!-- Mostrar los días en formato específico-->
                <small>Días: {{ habit.days }}</small>
            </div>

            <div class="buttons">

                <!-- Registrar completado por día -->
                <a href="{{ url_for('main.view_weekly', habit_id=habit.id) }}" class="tooltip">
                    <button class="btn btn-complete" type="button">
                        <i class="fa-solid fa-calendar-check"></i>
                    </button>
                    <span class="tooltiptext">Registrar día</span>
                </a>

                <!-- Botón editar -->
                <a href="{{ url_for('main.edit_weekly', habit_id=habit.id) }}" class="tooltip">
                    <button class="btn btn-edit" type="button">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <span class="tooltiptext">Editar</span>
                </a>

                <!-- Eliminar -->
                <form action="{{ url_for('main.delete_weekly', habit_id=habit.id) }}" method="POST" class="tooltip">
                    <button class="btn btn-delete" type="submit">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <span class="tooltiptext">Eliminar</span>
                </form>

            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
