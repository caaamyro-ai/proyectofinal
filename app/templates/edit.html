<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Hábito</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="header">
        <h1>Editar hábito</h1>
        <a href="{{ url_for('main.index') }}" class="back-link">← Volver</a>
    </header>

    <main class="container">

        <form action="{{ url_for('main.update_habit', habit_id=habit.id) }}" method="POST" class="edit-form">

            <div class="form-group">
                <label for="title">Nombre del hábito</label>
                <input 
                    type="text" 
                    id="title" 
                    name="title" 
                    value="{{ habit.title }}" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea 
                    id="description" 
                    name="description"
                    rows="4"
                >{{ habit.description }}</textarea>
            </div>

            <div class="buttons">
                <button type="submit" class="save-btn">Guardar cambios</button>

                <a 
                    href="{{ url_for('main.index') }}" 
                    class="cancel-btn"
                >
                    Cancelar
                </a>
            </div>

        </form>
    </main>

</body>
</html>
