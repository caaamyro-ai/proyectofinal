<!--AQUÍ EDITEN LO QUE QUIERAN, ESTO ES SÓLO UN FORMATO PARA QUE NO SE CAIGA LA APP-->
<!--Creo que se debe hacer un edit para hábitos diarios y semanales-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Hábito</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="header">
        <h1>Editar hábito</h1>
        <a href="{{ url_for('main.index') }}" class="back-link">← Volver</a>
    </header>

    <main class="container">

        <!-- Formulario para editar un hábito (envía POST a update_habit) -->
        <form action="{{ url_for('main.update_habit', habit_id=habit.id) }}" method="POST">

            <div class="form-group">
                <label for="name">Nombre del hábito</label>
                
                <!-- Campo de texto con el valor actual del hábito -->
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    value="{{ habit.name }}" 
                    required
                >
            </div>

            <!-- Como tu modelo NO tiene "description", elimino ese campo -->
            <!-- Si quieres agregar descripción en el futuro, la volvemos a activar -->

            <div class="buttons">
                <button type="submit" class="save-btn">Guardar cambios</button>

                <a 
                    href="{{ url_for('main.index') }}" 
                    class="cancel-btn"
                >
                    Cancelar
                </a>
            </div>

        </form>
    </main>

</body>
</html>
