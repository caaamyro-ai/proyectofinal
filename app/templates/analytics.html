<!-- Tarjetas de estadísticas -->
<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-label">Racha actual</div>
        <div class="stat-number">{{ current_streak }}</div>
        <div class="stat-label">días 🔥</div>
    </div>
    
    <div class="stat-card">
        <div class="stat-label">Hábitos completados</div>
        <div class="stat-number">{{ completion_rate }}%</div>
        <div class="stat-label">esta semana</div>
    </div>
    
    <div class="stat-card">
        <div class="stat-label">Total hábitos</div>
        <div class="stat-number">{{ total_habits }}</div>
        <div class="stat-label">activos</div>
    </div>
    
    <div class="stat-card">
        <div class="stat-label">Mejor racha</div>
        <div class="stat-number">{{ best_streak }}</div>
        <div class="stat-label">días 🏆</div>
    </div>
</div>
